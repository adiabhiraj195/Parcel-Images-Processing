[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-intelligence-backend"
version = "0.1.0"
description = "Local-first parcel-image processing prototype for warehouse shipment operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Warehouse Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0.80",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.38.0",
    "zxing-cpp>=2.2.0",
    "paddleocr>=2.7.3",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "moto[s3]>=5.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
